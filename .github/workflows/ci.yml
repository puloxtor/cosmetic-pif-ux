name: CI

# Finding G1: всеки push/PR инсталира ПИНОВАНИЯ енджин и пуска тестовете
# (вкл. test_engine_contract — версионния предпазител) + JS тестовете.
# Branch protection трябва да изисква този job зелен преди merge (вж. G2).
on:
  push:
    branches: ["claude/epic-mccarthy-nW68A"]
  pull_request:
    branches: ["claude/epic-mccarthy-nW68A"]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (pinned engine + app deps)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Python tests
        run: python -m pytest tests/ -v

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install JS deps
        run: npm install
      - name: Run JS tests (jsdom)
        run: npm test
